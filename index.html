<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income Statement</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/kelpui@0/css/kelp.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/kelpui@0/js/kelp.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/kelpui@0/js/dark-mode-auto.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="center">Income Statement</h1>
    <kelp-toc list-class="list-inline callout"></kelp-toc>
    <form id="myform">
    <section id="income">
        <h2>Income</h2>
        <label>Monthly Salary: <input type="number" id="salary" placeholder="0"></label>
        <label>Spouse Salary: <input type="number" id="spouseSalary" placeholder="0"></label>
        <label>Side Gig: <input type="number" id="sideGigSalary" placeholder="0"></label>
        <label>Stock Dividends: <input type="number" id="stockDividends" value="0" readonly></label>
        <label>Property/Business Income: <input type="number" id="propertyIncome" value="0" readonly></label>
        <label>Total Passive Income: <input type="number" id="totalPassiveIncome" value="0" readonly></label>
        <label>Total Income: <input type="number" id="totalIncome" value="0" readonly></label>
    </section>

    <hr>

    <section id="expenses">
        <h2>Expenses</h2>
        <label>Taxes: <input type="number" id="taxes" value="0"></label>
        <label>Mortgage/Rent: <input type="number" id="mortgage" value="0"></label>
        <label>School Loan Amount: <input type="number" id="schoolLoanAmount" value="0"></label>
        <label>Monthly School Loan Payment: <input type="number" id="schoolLoanPayment" value="0" readonly></label>
        <label>Car Loan: <input type="number" id="carLoan" value="0"></label>
        <label>Other Expenses: <input type="number" id="otherExpenses" value="0"></label>
        <label>Children (0-4): <input type="number" id="children" min="0" max="4" value="0"></label>
        <label>Cost per Child: <input type="number" id="costPerChild" value="0"></label>
        <label>Total Child Expenses: <input type="number" id="totalChildExpenses" value="0" readonly></label>
        <label>Personal Loan: <input type="number" id="personalLoan" value="0"></label>
        <label>Monthly Personal Loan Payment: <input type="number" id="personalLoanPayment" value="0" readonly></label>
        <label>Business Loan: <input type="number" id="businessLoan" value="0"></label>
        <label>Monthly Business Loan Payment: <input type="number" id="businessLoanPayment" value="0" readonly></label>
        <label>Total Expenses: <input type="number" id="totalExpenses" value="0" readonly></label>
    </section>

    <hr>

    <section id="cashFlow">
        <h2>Cash Flow</h2>
        <label>Total Cash Flow: <input type="number" id="totalCashFlow" value="0" readonly></label>
        <label>Cash on Hand: <input type="number" id="cashOnHand" value="0" readonly></label>
        <div class="justify-center cluster">
            <button id="getPaid" class="primary">Get Paid</button>
            <button id="addMoney" class="success">Add Money</button>
            <button id="takeMoney" class="danger">Take Away Money</button>
        </div>
    </section>

    <hr>

    <h2>Properties and Businesses</h2>
    <table id="properties">
        <tr>
            <th>Property/Business</th>
            <th>DP/Initial Investment</th>
            <th>Cash Flow</th>
        </tr>
        <script>
            for (let i = 0; i < 10; i++) {
                document.write("<tr><td><input type='text'></td><td><input type='number' class='dpInput' placeholder='0'></td><td><input type='number' class='cashFlowInput' placeholder='0'></td></tr>");
            }
        </script>
    </table>

    <hr>

    <h2>Stocks</h2>
    <table id="stocks">
        <tr>
            <th>Asset</th>
            <th>Quantity</th>
            <th>Cost/Share</th>
        </tr>
        <tr>
            <td>Stock A</td>
            <td><input type="number" id="stockAQty" value="0"></td>
            <td><input type="number" id="stockACost" value="0"></td>
        </tr>
        <tr>
            <td>Stock B</td>
            <td><input type="number" id="stockBQty" value="0"></td>
            <td><input type="number" id="stockBCost" value="0"></td>
        </tr>
    </table>
    <div class="justify-center cluster">
        <button id="buyStock" class="success">Buy Stock</button>
        <button id="sellStock" class="danger">Sell Stock</button>
	</div>

    <hr>

    <h2>Gold Coins</h2>
    <table id="gold">
        <tr>
            <th>Asset</th>
            <th>Quantity</th>
            <th>Cost/Coin</th>
        </tr>
        <tr>
            <td>Gold Coins</td>
            <td><input type="number" id="goldQty" value="0"></td>
            <td><input type="number" id="goldCost" value="0"></td>
        </tr>
    </table>
    <div class="justify-center cluster">
        <button id="buyGold" class="success">Buy Gold</button>
        <button id="sellGold" class="danger">Sell Gold</button>
    </div>

    <hr>

<h2>Trading Cards</h2>
<table id="tradingCards">
    <tr>
        <th>Asset</th>
        <th>Quantity</th>
        <th>Cost/Card</th>
    </tr>
    <tr>
        <td>Trading Cards</td>
        <td><input type="number" id="tradingCardsQty" value="0"></td>
        <td><input type="number" id="tradingCardsCost" value="0"></td>
    </tr>
</table>
<div class="justify-center cluster">
    <button id="buyTradingCards" class="success">Buy Trading Cards</button>
    <button id="sellTradingCards" class="danger">Sell Trading Cards</button>
</div>
</form>
<h2>Clear Calculator</h2>
<div class="justify-center cluster">
    <button id="clearCalculator" class="danger">Clear</button>
</div>


<script src="script.js"></script>
</body>
</html>
